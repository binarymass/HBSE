[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hbse"
version = "0.1.0"
description = "Hardware Bound Secrets Enclave cryptographic foundation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=46.0.0",
    "pydantic>=2.12.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]
test = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
hbse = "hbse.cli:main"
hbse-broker = "hbse.broker_daemon:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src/hbse"]
